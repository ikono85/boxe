<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Boxing Arena">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140a0a"/>
      <stop offset="45%" stop-color="#2a0f12"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ffe9c2" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#ff8a3d" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffd9a0"/>
      <stop offset="100%" stop-color="#ff7a2f"/>
    </linearGradient>
    <linearGradient id="rope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0352f"/>
      <stop offset="50%" stop-color="#ff6b4a"/>
      <stop offset="100%" stop-color="#e0352f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#spot)"/>

  <!-- canvas floor -->
  <path d="M0 236 L1200 236 L1200 320 L0 320 Z" fill="#1b2c4a" opacity="0.55"/>
  <path d="M0 236 L1200 236" stroke="#5a7bb0" stroke-opacity="0.35" stroke-width="2"/>

  <!-- ring ropes -->
  <g opacity="0.85">
    <rect x="0" y="150" width="1200" height="5" fill="url(#rope)" rx="2.5"/>
    <rect x="0" y="186" width="1200" height="5" fill="url(#rope)" rx="2.5"/>
    <rect x="0" y="222" width="1200" height="5" fill="url(#rope)" rx="2.5"/>
    <rect x="86" y="142" width="12" height="94" rx="6" fill="#d9d9e0" opacity="0.5"/>
    <rect x="1102" y="142" width="12" height="94" rx="6" fill="#d9d9e0" opacity="0.5"/>
  </g>

  <!-- left glove -->
  <g transform="translate(150 150) rotate(-14)" filter="url(#glow)">
    <path d="M0 0 q0 -46 46 -46 h30 q46 0 46 46 v30 q0 38 -46 38 h-30 q-46 0 -46 -38 z" fill="#e0352f"/>
    <path d="M-20 10 q-20 4 -20 22 q0 20 22 20 h18 z" fill="#c42a26"/>
    <rect x="18" y="62" width="86" height="18" rx="9" fill="#8e1d1a"/>
    <path d="M18 24 h104" stroke="#ff8e7a" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- right glove -->
  <g transform="translate(1050 150) rotate(14) scale(-1 1)" filter="url(#glow)">
    <path d="M0 0 q0 -46 46 -46 h30 q46 0 46 46 v30 q0 38 -46 38 h-30 q-46 0 -46 -38 z" fill="#1f4fd8"/>
    <path d="M-20 10 q-20 4 -20 22 q0 20 22 20 h18 z" fill="#1a3fae"/>
    <rect x="18" y="62" width="86" height="18" rx="9" fill="#13307f"/>
    <path d="M18 24 h104" stroke="#8fb0ff" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="600" y="132" text-anchor="middle" font-family="Impact, 'Haettenschweiler', 'Arial Black', sans-serif"
        font-size="104" letter-spacing="4" fill="url(#title)">BOXING ARENA</text>
  <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="21" letter-spacing="7" fill="#ffd0a8" opacity="0.92">BOXE FPS ARCADE · NAVIGATEUR · 1v1 EN LIGNE</text>

  <text x="600" y="286" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" letter-spacing="3" fill="#9fb4d8" opacity="0.8">THREE.JS · VITE · WEBRTC ROLLBACK NETCODE</text>
</svg>
